[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "esp32-sdr-research"
version = "0.1.0"
description = "Native burst-aware ESP32 RF research workbench"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pyserial>=3.5", "PySide6>=6.5", "pyqtgraph>=0.13"]
[project.optional-dependencies]
flash = ["esptool>=5.0"]
test = ["pytest>=8"]
validation = ["pytest>=8", "dbus-next==0.2.3"]

[project.scripts]
esp32-sdr = "sdr_research.gui:main"
[tool.setuptools]
packages = ["sdr_research"]
[tool.pytest.ini_options]
testpaths = ["tests"]
