[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "esp32-sdr-research"
version = "0.1.0"
description = "Native burst-aware ESP32 RF research workbench"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pyserial>=3.5",
    "pyqtgraph>=0.13",
    # PySide6 6.12.0 over-releases None while pyqtgraph paints. On Python 3.10 and 3.11
    # that aborts the viewer within seconds; from 3.12 None is immortal and it is harmless.
    "PySide6>=6.5; python_version >= '3.12'",
    "PySide6>=6.5,<6.12; python_version < '3.12'",
]

[project.optional-dependencies]
# esptool is only needed for the manual flashing steps in docs/firmware-build.md.
flash = ["esptool>=5.0"]
test = ["pytest>=8"]
# The formatter version is pinned so `ruff format --check` is reproducible in CI.
dev = ["pytest>=8", "ruff==0.16.9"]

[project.urls]
Repository = "https://github.com/jaykobdetar/esp32-sdr-workbench"

[project.scripts]
esp32-sdr = "sdr_research.gui:main"

[tool.setuptools]
packages = ["sdr_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["firmware/components", "docs/evidence"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# E501: long UI strings and protocol format strings are left to the formatter.
# E731/E741: short lambdas and single-letter names are used throughout the DSP code.
ignore = ["E501", "E731", "E741"]
