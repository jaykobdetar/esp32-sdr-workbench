name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and host tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install the viewer with development tools
        run: python -m pip install -e ".[dev]"
      - name: Lint and format check
        run: |
          ruff check .
          ruff format --check .
      # Includes the offline evidence recalculation in tests/test_evidence.py.
      - name: Viewer and evidence tests
        run: QT_QPA_PLATFORM=offscreen python -m pytest -q
      # Host C checks run under UndefinedBehaviorSanitizer; no ESP-IDF build or hardware.
      - name: Firmware host tests
        run: python -m pytest -q firmware/tests
