name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and host tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      # Print a traceback if Qt or an extension module aborts the interpreter.
      PYTHONFAULTHANDLER: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install the viewer with development tools
        run: python -m pip install -e ".[dev]"
      - name: Lint and format check
        run: |
          ruff check .
          ruff format --check .
      # Runs tests/, firmware/tests/ and nrf52840-transmitter/tests/ (see pyproject.toml).
      # Includes the offline evidence recalculations and host C checks under
      # UndefinedBehaviorSanitizer, plus transmitter parser/schedule/stop/CRC checks.
      # Firmware compile jobs are in firmware.yml. No hardware.
      - name: Host tests
        run: QT_QPA_PLATFORM=offscreen python -m pytest -q
